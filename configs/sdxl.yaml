data:
  save_dir: ${oc.env:DATASET_DIR}/sdxl/${logger.notes}_log
  metadata: ${oc.env:DATASET_DIR}/gcc3m/Validation_GCC-1.1.0-Validation.tsv
  size: 100
  batch_size: 4
  effective_batch_size: 4

trainer:
  epochs: 4
  beta: 0.5
  epsilon: 0.
  lr: 5e-1
  attn_lr: 0.15
  ff_lr: 0.15
  n_lr: 0
  model: sdxl # [sd1, sd2, sdxl, sd3]
  device: "cuda:0"
  num_intervention_steps: 50
  seed: 44
  init_lambda: 5
  regex: ".*" # "^(down_blocks.[1,2]).*" # optional are ^(down_blocks).*, ^(up_blocks).*, .* (for all heads)
  attn_name: attn # use to filter the attention heads, e.g. attn2 only for cross attention
  head_num_filter: 1 # number of heads to filter, apply lambda to the layter that has more than head_num_filter heads
  masking: "sigmoid" # [sigmoid, hard_discrete]
  masking_eps: 0.5
  use_log: false
  precision: 'bf16' # [fp16, bf16]
  disable_progress_bar: true
  accumulate_grad_batches: 1 # batch size
  grad_checkpointing: true # prefered for large models or large num_intervention_steps

lr_scheduler:
  type: "constant" # [linear, cosine, cosine_with_restarts, constant, polynomial]
  warmup_steps: 10 # helps to start with a lower learning rate
  num_cycles: 1
  power: 1.0
  decay_steps: 0

loss:
  reg: 1 # 2 for L2 norm, 1 for L1 norm, 0 for L0 norm
  reconstruct: 2 # 2 for L2 norm, 1 for L1 norm
  use_attn_reg: true
  use_ffn_reg: true
  mean: true
  lambda_reg: false 
  reg_alpha: 0.4
  reg_beta: 1

logger:
  output_dir: "results"
  log_dir: "csv"
  type: "csv" # [wandb, csv]
  plot_interval: 10
  project: "sdxl"
  notes: model_${trainer.model}_eps_${trainer.masking_eps}_sample_${data.size}_beta_${trainer.beta}_epochs_${trainer.epochs}_lr_${trainer.attn_lr}_${trainer.ff_lr}_batch_size_${data.effective_batch_size}_loss_${loss.reconstruct}_${loss.reg}_regex_${trainer.regex}_masking_${trainer.masking}
  tags:
    - "large_blocks_lambda_only"
    - "beta_${trainer.beta}"
    - "recon_norm_${loss.reconstruct}"
    - "reg_norm_${loss.reg}"
  save_lambda_path:
    ffn: "results/${logger.project}/${logger.notes}/latest_lambda.pt"
    attn: "results/${logger.project}/${logger.notes}/latest_lambda.pt"

accelerator:
  gradient_accumulation_steps: 1
  mixed_precision: False
  report_to: ${logger.type}

debug: false
debug_cfg:
  data.size: 20
  logger.plot_interval: 5
  trainer.num_intervention_steps: 50
  logger.type: "csv"
  logger.project: "sdxl_debug"
